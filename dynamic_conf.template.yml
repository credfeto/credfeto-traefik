---
# dynamic_conf.yml
tls:
  options:
    default:
      minVersion: VersionTLS13
      sniStrict: true

http:
  serversTransports:
    pacman:
      insecureSkipVerify: true
      serverName: "pacman.local"
    aur-repo:
      insecureSkipVerify: true
      serverName: "aur-repo.local"

    defi:
      insecureSkipVerify: true
      serverName: "defi.local"
    ollama:
      insecureSkipVerify: true
      serverName: "ollama.local"
    flathub:
      insecureSkipVerify: true
      serverName: "flathub.local"
    dns:
      insecureSkipVerify: true
      serverName: "dns.markridgwell.com"
    dns-admin:
      insecureSkipVerify: true
      serverName: "dns-server"

    api-nuget:
      insecureSkipVerify: true
      serverName: "api.nuget.local"
    funfair-nuget:
      insecureSkipVerify: true
      serverName: "funfair.nuget.local"
    funfair-prerelease-nuget:
      insecureSkipVerify: true
      serverName: "funfair-prerelease.nuget.local"
    npm:
      insecureSkipVerify: true
      serverName: "npm.local"
    dotnet:
      insecureSkipVerify: true
      serverName: "builds.dotnet.local"
    git-workflow:
      insecureSkipVerify: true
      serverName: "git-workflow.markridgwell.com"
    workflow-mcp:
      insecureSkipVerify: true
      serverName: "workflow-mcp.markridgwell.com"
    cctv:
      insecureSkipVerify: true
      serverName: "cctv.local"
    keys:
      insecureSkipVerify: true
      serverName: "keys.local"

  routers:
    # Dashboard router
    traefik-dashboard:
      rule: "Host(`proxy.markridgwell.com`)"
      service: api@internal
      entryPoints:
        - web-general
      middlewares:
        - internal-only
      # No middleware for authentication now

    # API NuGet router
    api-nuget-router:
      rule: "Host(`api-nuget.markridgwell.com`)"
      service: api-nuget-service
      entryPoints:
        - web-general
      middlewares:
        - api-nuget-header

    # Funfair NuGet router
    funfair-nuget-router:
      rule: "Host(`funfair-nuget.markridgwell.com`)"
      service: funfair-nuget-service
      entryPoints:
        - web-general
      middlewares:
        - funfair-nuget-header

    # Funfair Prerelease NuGet router
    funfair-prerelease-nuget-router:
      rule: "Host(`funfair-prerelease-nuget.markridgwell.com`)"
      service: funfair-prerelease-nuget-service
      entryPoints:
        - web-general
      middlewares:
        - funfair-prerelease-nuget-header

    # New npm router
    npm-router:
      rule: "Host(`npm.markridgwell.com`)"
      service: npm-service
      entryPoints:
        - web-general
      middlewares:
        - npm-header

    # New dotnet router
    dotnet-router:
      rule: "Host(`dotnet.markridgwell.com`)"
      service: dotnet-service
      entryPoints:
        - web-general
      middlewares:
        - dotnet-header
        - internal-only

    # New hosts
    pacman-router:
      rule: "Host(`pacman.markridgwell.com`)"
      service: pacman-service
      entryPoints:
        - web-general
      middlewares:
        - pacman-header

    flathub-router:
      rule: "Host(`flathub.markridgwell.com`)"
      service: flathub-service
      entryPoints:
        - web-general
      middlewares:
        - flathub-header

    aur-repo-router:
      rule: "Host(`aur-repo.markridgwell.com`)"
      service: aur-repo-service
      entryPoints:
        - web-general
      middlewares:
        - aur-repo-header
        - internal-only

    photos-router:
      rule: "Host(`photos.markridgwell.com`)"
      service: photos-service
      entryPoints:
        - web-general

    homeassistant-router:
      rule: "Host(`homeassistant.markridgwell.com`)"
      service: homeassistant-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    audiobookshelf-router:
      rule: "Host(`audiobookshelf.markridgwell.com`)"
      service: audiobookshelf-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    familiar-router:
      rule: "Host(`familiar.markridgwell.com`)"
      service: familiar-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    home-router:
      rule: "Host(`home.markridgwell.com`)"
      service: home-service
      entryPoints:
        - web-general
      middlewares:
        - home-header

    home-http-router:
      rule: "PathPrefix(`/`)"
      service: home-service
      entryPoints:
        - web-home
      middlewares:
        - home-header


    docker-cache-router:
      rule: "Host(`docker-cache.markridgwell.com`)"
      service: docker-cache-service
      entryPoints:
        - web-general
      middlewares:
        - docker-cache-header
        - internal-only


    defi-router:
      rule: "Host(`defi.markridgwell.com`)"
      service: defi-service
      entryPoints:
        - web-general
      middlewares:
        - defi-header

    defi-http-router:
      rule: "PathPrefix(`/`)"
      service: defi-service
      entryPoints:
        - web-defi
      middlewares:
        - defi-header

    ollama-router:
      rule: "Host(`ollama.markridgwell.com`)"
      service: ollama-service
      entryPoints:
        - web-general
      middlewares:
        - ollama-header
        - internal-only

    linux-cache-01-router:
      rule: "Host(`linux-cache-01.markridgwell.com`)"
      service: linux-cache-01-service
      entryPoints:
        - web-general
      middlewares:
        - linux-cache-01-header
        - internal-only

    linux-cache-02-router:
      rule: "Host(`linux-cache-02.markridgwell.com`)"
      service: linux-cache-02-service
      entryPoints:
        - web-general
      middlewares:
        - linux-cache-02-header
        - internal-only

    dev-cache-01-router:
      rule: "Host(`dev-cache-01.markridgwell.com`)"
      service: dev-cache-01-service
      entryPoints:
        - web-general
      middlewares:
        - dev-cache-01-header
        - internal-only

    dev-cache-02-router:
      rule: "Host(`dev-cache-02.markridgwell.com`)"
      service: dev-cache-02-service
      entryPoints:
        - web-general
      middlewares:
        - dev-cache-02-header
        - internal-only

    dns-router-v6:
      rule: "Host(`dns.markridgwell.com`) && ClientIP(`::/0`)"
      priority: 100
      service: dns-service-v6-failover
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    dns-router:
      rule: "Host(`dns.markridgwell.com`)"
      priority: 1
      service: dns-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    dns-01-router-v6:
      rule: "Host(`dns-01.markridgwell.com`) && ClientIP(`::/0`)"
      priority: 100
      service: dns-01-service-v6-failover
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    dns-01-router:
      rule: "Host(`dns-01.markridgwell.com`)"
      priority: 1
      service: dns-01-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    dns-02-router-v6:
      rule: "Host(`dns-02.markridgwell.com`) && ClientIP(`::/0`)"
      priority: 100
      service: dns-02-service-v6-failover
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    dns-02-router:
      rule: "Host(`dns-02.markridgwell.com`)"
      priority: 1
      service: dns-02-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    dns-03-router-v6:
      rule: "Host(`dns-03.markridgwell.com`) && ClientIP(`::/0`)"
      priority: 100
      service: dns-03-service-v6-failover
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    dns-03-router:
      rule: "Host(`dns-03.markridgwell.com`)"
      priority: 1
      service: dns-03-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    dns-04-router-v6:
      rule: "Host(`dns-04.markridgwell.com`) && ClientIP(`::/0`)"
      priority: 100
      service: dns-04-service-v6-failover
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    dns-04-router:
      rule: "Host(`dns-04.markridgwell.com`)"
      priority: 1
      service: dns-04-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    dns-05-router-v6:
      rule: "Host(`dns-05.markridgwell.com`) && ClientIP(`::/0`)"
      priority: 100
      service: dns-05-service-v6-failover
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    dns-05-router:
      rule: "Host(`dns-05.markridgwell.com`)"
      priority: 1
      service: dns-05-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    dns-06-router-v6:
      rule: "Host(`dns-06.markridgwell.com`) && ClientIP(`::/0`)"
      priority: 100
      service: dns-06-service-v6-failover
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    dns-06-router:
      rule: "Host(`dns-06.markridgwell.com`)"
      priority: 1
      service: dns-06-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    github-api-router:
      rule: "Host(`github-api.markridgwell.com`)"
      service: github-api-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    git-workflow-router:
      rule: "Host(`git-workflow.markridgwell.com`)"
      service: git-workflow-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    workflow-mcp-router:
      rule: "Host(`workflow-mcp.markridgwell.com`)"
      service: workflow-mcp-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    cctv-router:
      rule: "Host(`cctv.markridgwell.com`)"
      service: cctv-service
      entryPoints:
        - web-general
      middlewares:
        - cctv-header
        - internal-only

    keys-router:
      rule: "Host(`keys.markridgwell.com`)"
      service: keys-service
      entryPoints:
        - web-general
      middlewares:
        - internal-only

    monitoring-router:
      rule: "Host(`monitoring.markridgwell.com`)"
      service: monitoring-service
      entryPoints:
        - web-general

    # Direct port routers (plain HTTP — TLS terminated by Cloudflare Tunnel)
    npm-direct-router:
      rule: "Host(`npm.markridgwell.com`)"
      service: npm-service
      entryPoints:
        - npm
      middlewares:
        - npm-header

    api-nuget-direct-router:
      rule: "Host(`api-nuget.markridgwell.com`)"
      service: api-nuget-service
      entryPoints:
        - api-nuget
      middlewares:
        - api-nuget-header

    photos-direct-router:
      rule: "Host(`photos.markridgwell.com`)"
      service: photos-service
      entryPoints:
        - photos
      middlewares:
        - photos-local-check

    pacman-direct-router:
      rule: "Host(`pacman.markridgwell.com`)"
      service: pacman-service
      entryPoints:
        - pacman
      middlewares:
        - pacman-header

    flathub-direct-router:
      rule: "Host(`flathub.markridgwell.com`)"
      service: flathub-service
      entryPoints:
        - flathub
      middlewares:
        - flathub-header

    funfair-nuget-direct-router:
      rule: "Host(`funfair-nuget.markridgwell.com`)"
      service: funfair-nuget-service
      entryPoints:
        - funfair-nuget
      middlewares:
        - funfair-nuget-header

    funfair-prerelease-nuget-direct-router:
      rule: "Host(`funfair-prerelease-nuget.markridgwell.com`)"
      service: funfair-prerelease-nuget-service
      entryPoints:
        - funfair-prerelease-nuget
      middlewares:
        - funfair-prerelease-nuget-header

    monitoring-direct-router:
      rule: "Host(`monitoring.markridgwell.com`) && Method(`POST`)"
      service: monitoring-service
      entryPoints:
        - monitoring


  services:
    # Services for each router
    pacman-service:
      loadBalancer:
        serversTransport: pacman
        healthCheck:
          # hostname: is required here - health checks bypass router
          # middleware entirely, so without it the probe's Host header is the
          # raw IP. The :7777 backend is a single nginx instance with two
          # SNI-selected vhosts (pacman.local, flathub.local) and no
          # default_server, so nginx falls back to its first block
          # (flathub.local) - without this, /ping here would silently check
          # flathub's vhost instead of pacman's own.
          hostname: pacman.local
          path: /ping
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://192.168.150.200:7777"
          - url: "https://192.168.150.201:7777"

    flathub-service:
      loadBalancer:
        serversTransport: flathub
        healthCheck:
          # flathub.local is nginx's first `listen 7777 ssl` block, so it's
          # already the effective default vhost - hostname: here is
          # belt-and-braces rather than a behaviour change, but every vhost
          # should set it explicitly rather than relying on nginx's block
          # order.
          hostname: flathub.local
          path: /ping
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://192.168.150.200:7777"
          - url: "https://192.168.150.201:7777"

    aur-repo-service:
      loadBalancer:
        serversTransport: aur-repo
        servers:
          - url: "https://192.168.150.10:5555"
          - url: "https://192.168.150.20:5555"

    photos-service:
      loadBalancer:
        healthCheck:
          path: /api/server/ping
          interval: 30s
          timeout: 5s
        servers:
          - url: "http://192.168.150.154:2283"

    homeassistant-service:
      loadBalancer:
        healthCheck:
          # /manifest.json is Home Assistant's one unauthenticated route
          # (ManifestJSONView.requires_auth = False), used upstream as the
          # public availability probe.
          path: /manifest.json
          interval: 30s
          timeout: 5s
        servers:
          - url: "http://192.168.34.8:8123"

    audiobookshelf-service:
      loadBalancer:
        healthCheck:
          # /healthcheck is Audiobookshelf's own unauthenticated endpoint
          # (server/Server.js: router.get('/healthcheck', ...) -> 200).
          path: /healthcheck
          interval: 30s
          timeout: 5s
        servers:
          # Port was 8080, which is actually Dozzle on this host - Audiobookshelf
          # itself is published on 13378 (docker-compose.yml: "13378:80", host:container;
          # no network_mode: host, so 80 is unreachable from outside the container).
          - url: "http://192.168.150.16:13378"

    familiar-service:
      loadBalancer:
        # No healthCheck: no unauthenticated health endpoint is known for this app.
        servers:
          - url: "http://192.168.150.129:8081"

    home-service:
      loadBalancer:
        healthCheck:
          path: /api/healthz
          interval: 30s
          timeout: 5s
        servers:
          - url: "http://192.168.150.150:8080"

    docker-cache-service:
      loadBalancer:
        healthCheck:
          path: /v2/
          interval: 30s
          timeout: 5s
        servers:
          - url: "http://192.168.150.202:8081"


    defi-service:
      loadBalancer:
        serversTransport: defi
        healthCheck:
          path: /ping
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://192.168.150.12"

    ollama-service:
      loadBalancer:
        serversTransport: ollama
        servers:
          - url: "https://192.168.150.10:5555"
          - url: "https://192.168.150.20:5555"

    linux-cache-01-service:
      loadBalancer:
        healthCheck:
          path: /healthcheck
          interval: 30s
          timeout: 5s
        servers:
          - url: "http://192.168.150.200:8080"

    linux-cache-02-service:
      loadBalancer:
        healthCheck:
          path: /healthcheck
          interval: 30s
          timeout: 5s
        servers:
          - url: "http://192.168.150.201:8080"

    dev-cache-01-service:
      loadBalancer:
        healthCheck:
          path: /healthcheck
          interval: 30s
          timeout: 5s
        servers:
          - url: "http://192.168.150.100:8080"

    dev-cache-02-service:
      loadBalancer:
        healthCheck:
          path: /healthcheck
          interval: 30s
          timeout: 5s
        servers:
          - url: "http://192.168.150.101:8080"

    api-nuget-service:
      loadBalancer:
        serversTransport: api-nuget
        healthCheck:
          # hostname: is required here - health checks bypass router
          # middleware entirely, so without it the probe's Host header is the
          # raw IP. The :5555 backend is a single nginx instance with five
          # SNI-selected vhosts and no default_server, so nginx falls back to
          # its first block (builds.dotnet.local) - every /ping here was
          # silently checking the dotnet cache-proxy instead of its own vhost.
          hostname: api.nuget.local
          path: /ping
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://192.168.150.100:5555"
          - url: "https://192.168.150.101:5555"

    funfair-nuget-service:
      loadBalancer:
        serversTransport: funfair-nuget
        healthCheck:
          hostname: funfair.nuget.local
          path: /ping
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://192.168.150.100:5555"
          - url: "https://192.168.150.101:5555"

    funfair-prerelease-nuget-service:
      loadBalancer:
        serversTransport: funfair-prerelease-nuget
        healthCheck:
          hostname: funfair-prerelease.nuget.local
          path: /ping
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://192.168.150.100:5555"
          - url: "https://192.168.150.101:5555"

    npm-service:
      loadBalancer:
        serversTransport: npm
        healthCheck:
          # Verdaccio's health endpoint, not the cache-proxy's /ping - this is
          # the one vhost on :5555 that isn't credfeto-cache-proxy.
          hostname: npm.local
          path: /-/ping
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://192.168.150.100:5555"
          - url: "https://192.168.150.101:5555"

    dotnet-service:
      loadBalancer:
        serversTransport: dotnet
        healthCheck:
          # builds.dotnet.local is nginx's first `listen 5555 ssl` block, so
          # it's already the effective default vhost - hostname: here is
          # belt-and-braces rather than a behaviour change, but every vhost
          # should set it explicitly rather than relying on nginx's block
          # order.
          hostname: builds.dotnet.local
          path: /ping
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://192.168.150.100:5555"
          - url: "https://192.168.150.101:5555"

    dns-service:
      loadBalancer:
        serversTransport: dns
        healthCheck:
          # Static RFC 8484 DoH GET query (base64url, no padding) for
          # 1dot1dot1dot1.cloudflare.com A: a real wire-format DNS query is
          # required here - Technitium's /dns-query only accepts ?dns=<query>,
          # it does not support the application/dns-json GET convenience API.
          path: "/dns-query?dns=AAABAAABAAAAAAAADTFkb3QxZG90MWRvdDEKY2xvdWRmbGFyZQNjb20AAAEAAQ"
          headers:
            Accept: "application/dns-message"
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://192.168.42.101"
          - url: "https://192.168.42.102"
          - url: "https://192.168.42.103"
          - url: "https://192.168.42.104"
          - url: "https://192.168.42.105"
          - url: "https://192.168.42.106"

    dns-service-v6:
      loadBalancer:
        serversTransport: dns
        healthCheck:
          # Static RFC 8484 DoH GET query (base64url, no padding) for
          # 1dot1dot1dot1.cloudflare.com A: a real wire-format DNS query is
          # required here - Technitium's /dns-query only accepts ?dns=<query>,
          # it does not support the application/dns-json GET convenience API.
          path: "/dns-query?dns=AAABAAABAAAAAAAADTFkb3QxZG90MWRvdDEKY2xvdWRmbGFyZQNjb20AAAEAAQ"
          headers:
            Accept: "application/dns-message"
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://[2a02:8010:61d5:42::101]"
          - url: "https://[2a02:8010:61d5:42::102]"
          - url: "https://[2a02:8010:61d5:42::103]"
          - url: "https://[2a02:8010:61d5:42::104]"
          - url: "https://[2a02:8010:61d5:42::105]"
          - url: "https://[2a02:8010:61d5:42::106]"

    # Composes dns-service-v6 and dns-service without mixing IPv4/IPv6
    # hosts in one pool: tries the IPv6 pool first, and once its health
    # check reports zero healthy servers, falls back to the IPv4 pool.
    dns-service-v6-failover:
      failover:
        service: dns-service-v6
        fallback: dns-service

    dns-01-service:
      loadBalancer:
        serversTransport: dns-admin
        healthCheck:
          # /api/status is unauthenticated and purpose-built for this: it
          # always returns HTTP 200 {"status":"ok"} without touching session
          # auth (unlike almost every other /api/* route on the console).
          path: /api/status
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://192.168.42.101:53443"

    dns-01-service-v6:
      loadBalancer:
        serversTransport: dns-admin
        healthCheck:
          # /api/status is unauthenticated and purpose-built for this: it
          # always returns HTTP 200 {"status":"ok"} without touching session
          # auth (unlike almost every other /api/* route on the console).
          path: /api/status
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://[2a02:8010:61d5:42::101]:53443"

    # See dns-service-v6-failover above for the failover rationale.
    dns-01-service-v6-failover:
      failover:
        service: dns-01-service-v6
        fallback: dns-01-service

    dns-02-service:
      loadBalancer:
        serversTransport: dns-admin
        healthCheck:
          # /api/status is unauthenticated and purpose-built for this: it
          # always returns HTTP 200 {"status":"ok"} without touching session
          # auth (unlike almost every other /api/* route on the console).
          path: /api/status
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://192.168.42.102:53443"

    dns-02-service-v6:
      loadBalancer:
        serversTransport: dns-admin
        healthCheck:
          # /api/status is unauthenticated and purpose-built for this: it
          # always returns HTTP 200 {"status":"ok"} without touching session
          # auth (unlike almost every other /api/* route on the console).
          path: /api/status
          interval: 30s
          timeout: 5s
        servers:
          - url: "https://[2a02:8010:61d5:42::102]:53443"

    # See dns-service-v6-failover above for the failover rationale.
    dns-02-service-v6-failover:
      failover:
        service: dns-02-service-v6
        fallback: dns-02-service

    dns-03-service:
